version: 5
settings:
  title: My Dashboard
  theme: auto
  layout:
    columns: 3
  search:
    engine: duckduckgo
    customUrl: ''
  apiKey: ${WAYFINDER_API_KEY}
  apiBase: http://localhost:8090/v1
  aiModel: gpt-4o
  passwordHash: ${WAYFINDER_PASSWORD_HASH}
widgets:
  - type: datetime
    config:
      format:
        dateStyle: full
        timeStyle: short
      locale: en
  - type: greeting
    config: {}
  - type: resources
    config: {}
  - type: weather
    config:
      location: London
groups:
  - name: Getting Started
    icon: ''
    collapsed: false
    bookmarks:
      - name: GitHub
        url: https://github.com
        icon: ''
        description: The world's largest open-source code hosting platform
        shortcut: ''
        tags: []
        server: ''
        container: ''
        statusCheck: false
      - name: YouTube
        url: https://www.youtube.com
        icon: ''
        description: YouTube
        shortcut: ''
        tags: []
        server: ''
        container: ''
        statusCheck: false
    groups: []
